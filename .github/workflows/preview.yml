name: PR Preview (Dev)

# PR を開く/更新するたびに Dev 用 Firebase プロジェクトへデプロイする。
#  - 固定 URL（https://<Devプロジェクト>.web.app）: いちばん新しく更新された PR の内容。
#    社内・顧客に確認してもらうときはこの URL を共有すれば、PR が変わっても URL は変わらない。
#  - PR ごとの URL（7日で失効）: PR にコメントされる。複数の PR を見比べたいとき用。
# 手動実行では任意のブランチを固定チャンネル（既定: dev）に 30 日間公開できる。

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      channel:
        description: "チャンネル名（例: dev, uat）"
        required: true
        default: "dev"

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number || inputs.channel }}
  cancel-in-progress: true

jobs:
  preview:
    # フォークからの PR では Secrets を使えないためスキップ
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Firebase config (dev)
        env:
          FIREBASE_API_KEY: ${{ secrets.DEV_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.DEV_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.DEV_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.DEV_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.DEV_FIREBASE_APP_ID }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::DEV_FIREBASE_* の Secrets が未設定です。docs/DEV_ENVIRONMENT.md を参照してください。"
            exit 1
          fi
          node scripts/build-config.js
          echo "// preview: config.js already points to the dev project" > js/config.local.js

      - name: Create Google API config (dev, optional)
        env:
          GOOGLE_API_KEY: ${{ secrets.DEV_GOOGLE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.DEV_GOOGLE_CLIENT_ID }}
        run: |
          echo "window.GOOGLE_API_KEY = '${GOOGLE_API_KEY}';" > js/google-config.local.js
          echo "window.GOOGLE_CLIENT_ID = '${GOOGLE_CLIENT_ID}';" >> js/google-config.local.js

      # ブランチの firestore.rules / indexes を Dev プロジェクトに反映（ルール変更も一緒に確認できる）
      - name: Deploy Firestore rules & indexes to dev
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.DEV_FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::DEV_FIREBASE_SERVICE_ACCOUNT が未設定です。"
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          if ! npx --yes firebase-tools@13 deploy --only firestore:rules,firestore:indexes \
               --project "$PROJECT_ID" --non-interactive --force; then
            echo "::error::Firestore ルールのデプロイに失敗しました。403 の場合はサービスアカウントに IAM ロール（Firebase Rules 管理者 / Cloud Datastore インデックス管理者 / Firebase Hosting 管理者 / Cloud Run 閲覧者 / API キー閲覧者）を付与してください。手順: docs/DEV_ENVIRONMENT.md 1-A-7"
            exit 1
          fi

      - name: Deploy to Firebase Hosting preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.DEV_FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          channelId: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || format('pr-{0}', github.event.number) }}
          expires: ${{ github.event_name == 'workflow_dispatch' && '30d' || '7d' }}

      # 固定 URL（Dev プロジェクトの本体 = live チャンネル）にも同じ内容を出す。
      # 複数の PR を同時に更新した場合は、あとから終わったほうの内容になる。
      - name: Deploy to the fixed Dev URL (live channel)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.DEV_FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Show the fixed Dev URL
        if: github.event_name == 'pull_request'
        env:
          PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          echo "### 固定の確認用 URL" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${PROJECT_ID}.web.app （PR #${PR_NUMBER} の内容）" >> "$GITHUB_STEP_SUMMARY"
